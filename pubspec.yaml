name: cuatro_retos
description: "Los cuatro retos (Películas TMDB, Gatos Cataas, Clima OpenWeatherMap y Cripto CoinGecko) en una sola app con arquitectura limpia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Peticiones HTTP a las APIs
  http: ^1.2.2
  # Manejo de estado (ViewModels con ChangeNotifier)
  provider: ^6.1.2
  # Ubicación GPS (el "plus" del reto del clima)
  geolocator: ^14.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
